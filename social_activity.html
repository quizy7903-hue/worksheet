<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>One India, Great India - Ultra-Fast CSS 3D World</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts & FontAwesome Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            touch-action: none; /* Custom touch inertia handler */
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(circle at center, #f8fafc 0%, #e2e8f0 100%);
            color: #0f172a;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Glassmorphism Header Bar */
        .glass-panel {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(226, 232, 240, 0.8);
            box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.08), 0 8px 10px -6px rgba(15, 23, 42, 0.04);
        }

        .btn-action {
            background: #ffffff;
            border: 1px solid #cbd5e1;
            color: #334155;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            min-height: 38px;
        }

        .btn-action:hover:not(:disabled) {
            background: #f8fafc;
            border-color: #94a3b8;
            color: #0f172a;
        }

        .btn-action:active:not(:disabled) {
            transform: scale(0.95);
            background: #f1f5f9;
        }

        .btn-action.active {
            background: #0f172a;
            border-color: #0f172a;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.18);
        }

        /* CSS 3D Hardware Accelerated Viewport */
        #viewport {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            perspective: 1200px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            z-index: 1;
        }

        #world_3d {
            position: relative;
            width: 320px;
            height: 452px; /* Standard A4 proportions */
            transform-style: preserve-3d;
            will-change: transform;
            cursor: grab;
        }

        #world_3d:active {
            cursor: grabbing;
        }

        @media (min-width: 640px) {
            #world_3d {
                width: 400px;
                height: 565px;
            }
        }

        @media (min-width: 1024px) {
            #world_3d {
                width: 460px;
                height: 650px;
            }
        }

        /* 3D Paper Layer Styling */
        .paper-layer {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            backface-visibility: hidden;
            will-change: transform;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .paper-layer img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            pointer-events: none;
        }

        /* Base Page Realistic Shadow and Background */
        #layer_base {
            background: #ffffff;
            border-radius: 6px;
            box-shadow: 
                0 20px 40px -10px rgba(15, 23, 42, 0.18),
                0 10px 15px -5px rgba(15, 23, 42, 0.08),
                0 0 0 1px rgba(0, 0, 0, 0.05);
        }

        /* Floating Layer Shadows */
        #layer_middle {
            filter: drop-shadow(0 16px 16px rgba(15, 23, 42, 0.18));
        }

        #layer_top {
            filter: drop-shadow(0 24px 22px rgba(15, 23, 42, 0.22));
        }

        /* Loading Spinner */
        .spinner {
            border: 3px solid #e2e8f0;
            border-top: 3px solid #ea580c;
            border-right: 3px solid #16a34a;
            border-radius: 50%;
            width: 42px;
            height: 42px;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-900 overflow-hidden select-none">

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="fixed inset-0 z-50 bg-slate-100/95 backdrop-blur-md flex flex-col items-center justify-center p-6 transition-opacity duration-500">
        <div class="glass-panel p-8 rounded-3xl flex flex-col items-center max-w-xs w-full text-center shadow-xl">
            <div class="relative mb-5 flex items-center justify-center">
                <div class="spinner"></div>
                <i class="fa-solid fa-layer-group text-orange-600 absolute text-xs"></i>
            </div>
            
            <h2 class="text-base font-bold font-serif text-slate-900 tracking-tight">
                One India, Great India
            </h2>
            <p class="text-xs text-slate-500 mt-1 mb-4 font-medium">Optimizing CSS 3D Layers...</p>

            <!-- Progress Bar -->
            <div class="w-full bg-slate-200 h-2 rounded-full overflow-hidden border border-slate-300">
                <div id="loading-bar" class="bg-gradient-to-r from-orange-500 via-slate-600 to-emerald-600 h-full w-0 transition-all duration-300"></div>
            </div>
            <span id="loading-text" class="text-[11px] text-slate-500 mt-2 font-mono">0 / 3 Images Processed</span>
        </div>
    </div>

    <!-- Top Navigation Controls Bar -->
    <header class="fixed top-3 left-3 right-3 z-30 flex items-center justify-between gap-2 p-2 sm:p-2.5 rounded-2xl glass-panel">
        
        <!-- Left: Project Title -->
        <div class="flex items-center gap-2.5">
            <div class="w-8 h-8 sm:w-9 sm:h-9 rounded-xl bg-gradient-to-tr from-orange-500 via-white to-emerald-600 p-[2px] shadow-sm flex-shrink-0">
                <div class="w-full h-full bg-white rounded-[10px] flex items-center justify-center">
                    <i class="fa-solid fa-layer-group text-orange-600 text-xs sm:text-sm"></i>
                </div>
            </div>
            <div class="hidden xs:block">
                <h1 class="font-bold text-xs sm:text-sm font-serif tracking-wide text-slate-900">
                    One India, Great India
                </h1>
                <p class="text-[9px] sm:text-[10px] text-slate-500 font-medium leading-none">Ultra-Fast 3D Document</p>
            </div>
        </div>

        <!-- Center: Minimal Page Control -->
        <div class="flex items-center gap-1 bg-slate-200/80 p-1 rounded-xl border border-slate-300 shadow-inner">
            <button id="btn-prev" class="btn-action w-8 h-8 rounded-lg flex items-center justify-center opacity-40 cursor-not-allowed text-slate-400" disabled title="Previous Page">
                <i class="fa-solid fa-chevron-left text-xs"></i>
            </button>
            <span class="px-2.5 sm:px-3 text-xs font-semibold text-slate-800 tracking-wider select-none whitespace-nowrap">
                Page 1 of 1
            </span>
            <button id="btn-next" class="btn-action w-8 h-8 rounded-lg flex items-center justify-center opacity-40 cursor-not-allowed text-slate-400" disabled title="Next Page">
                <i class="fa-solid fa-chevron-right text-xs"></i>
            </button>
        </div>

        <!-- Right: View Preset Buttons -->
        <div class="flex items-center gap-1">
            <button id="btn-top" class="btn-action px-2.5 sm:px-3 py-1.5 rounded-xl text-xs font-medium flex items-center gap-1.5">
                <i class="fa-solid fa-arrows-to-dot text-orange-600 text-xs"></i>
                <span class="hidden md:inline">Top View</span>
            </button>
            <button id="btn-iso" class="btn-action px-2.5 sm:px-3 py-1.5 rounded-xl text-xs font-medium flex items-center gap-1.5 active">
                <i class="fa-solid fa-cube text-emerald-600 text-xs"></i>
                <span class="hidden md:inline">3D View</span>
            </button>
            <button id="btn-reset" class="btn-action w-8 h-8 rounded-xl flex items-center justify-center" title="Reset Camera">
                <i class="fa-solid fa-rotate-left text-xs"></i>
            </button>
        </div>
    </header>

    <!-- Bottom Touch Interaction Hint -->
    <div class="fixed bottom-4 left-1/2 -translate-x-1/2 z-20 glass-panel px-4 py-2 rounded-full text-[11px] text-slate-700 flex items-center gap-2.5 shadow-lg pointer-events-none whitespace-nowrap max-w-[90vw] overflow-hidden">
        <span class="flex items-center gap-1 text-orange-600 font-semibold">
            <i class="fa-solid fa-hand-pointer animate-pulse"></i> Touch & Drag to Orbit
        </span>
        <span class="text-slate-300">•</span>
        <span class="text-emerald-700 flex items-center gap-1 font-semibold">
            <i class="fa-solid fa-up-down text-xs"></i> Tilt for 3D Layer Explosion
        </span>
    </div>

    <!-- Hardware Accelerated CSS 3D Viewport -->
    <div id="viewport">
        <div id="world_3d">
            <!-- Base Layer: Main Sheet -->
            <div id="layer_base" class="paper-layer">
                <img id="img_base" alt="Base Sheet">
            </div>

            <!-- Middle Layer: Scenic Collage -->
            <div id="layer_middle" class="paper-layer">
                <img id="img_middle" alt="Scenic Collage">
            </div>

            <!-- Top Layer: India Map -->
            <div id="layer_top" class="paper-layer">
                <img id="img_top" alt="India Map">
            </div>
        </div>
    </div>

    <script>
        // Local file configuration matching directory structure
        const IMAGE_FILES = {
            base: 'social front page 2.png',
            middle: 'social front page 3.png',
            top: 'social front page india image.png'
        };

        // 3D Transform State with Inertia / Lerp Physics
        const state = {
            rotX: 42,        // Tilt angle in degrees
            rotY: -18,       // Orbit angle in degrees
            scale: 0.95,     // Zoom level
            panX: 0,         // Horizontal pan offset
            panY: 0,         // Vertical pan offset
            
            // Targets for smooth lerping
            targetRotX: 42,
            targetRotY: -18,
            targetScale: 0.95,
            targetPanX: 0,
            targetPanY: 0,

            // Vertical separation gap config (in pixels)
            maxZGap: 80,
            currentZGap: 0
        };

        let loadedCount = 0;
        const TOTAL_LAYERS = 3;

        /**
         * Fast 2D Canvas processor to remove dark backgrounds on load.
         * Runs once during startup and creates standard transparent image URLs.
         */
        function processImageChromaKey(src, options = {}) {
            return new Promise((resolve) => {
                const img = new Image();
                img.crossOrigin = 'anonymous';

                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = img.width;
                    canvas.height = img.height;
                    const ctx = canvas.getContext('2d', { willReadFrequently: true });

                    ctx.drawImage(img, 0, 0);

                    if (options.removeBlack) {
                        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                        const data = imgData.data;
                        const threshold = options.threshold || 28;

                        for (let i = 0; i < data.length; i += 4) {
                            const r = data[i];
                            const g = data[i + 1];
                            const b = data[i + 2];

                            // Pitch black background check
                            if (r <= threshold && g <= threshold && b <= threshold) {
                                data[i + 3] = 0; // Set transparent
                            } else if (r <= threshold * 1.5 && g <= threshold * 1.5 && b <= threshold * 1.5) {
                                // Smooth edge feathering
                                const maxVal = Math.max(r, g, b);
                                const factor = (maxVal - threshold) / (threshold * 0.5);
                                data[i + 3] = Math.floor(Math.min(255, Math.max(0, factor * 255)));
                            }
                        }
                        ctx.putImageData(imgData, 0, 0);
                    }

                    resolve(canvas.toDataURL('image/png'));
                };

                img.onerror = () => {
                    console.warn(`Could not load local image: ${src}. Rendering fallback graphic.`);
                    resolve(generateProceduralFallback(options.type));
                };

                img.src = encodeURI(src);
            });
        }

        /**
         * High quality procedural white paper fallback generator.
         * Guarantees the document is bright and beautiful even if files are missing.
         */
        function generateProceduralFallback(type) {
            const canvas = document.createElement('canvas');
            canvas.width = 800;
            canvas.height = 1131; // A4 aspect ratio
            const ctx = canvas.getContext('2d');

            if (type === 'base') {
                ctx.fillStyle = '#FFFFFF';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Tricolor Border
                ctx.strokeStyle = '#EA580C';
                ctx.lineWidth = 12;
                ctx.strokeRect(20, 20, canvas.width - 40, canvas.height - 40);

                ctx.strokeStyle = '#16A34A';
                ctx.lineWidth = 12;
                ctx.strokeRect(32, 32, canvas.width - 64, canvas.height - 64);

                ctx.fillStyle = '#0F172A';
                ctx.font = 'bold 42px serif';
                ctx.textAlign = 'center';
                ctx.fillText('ONE INDIA, GREAT INDIA', 400, 220);

                ctx.fillStyle = '#EA580C';
                ctx.font = 'bold 28px sans-serif';
                ctx.fillText('JAMMU & KASHMIR  vs  TAMIL NADU', 400, 300);

                ctx.fillStyle = '#64748B';
                ctx.font = '18px sans-serif';
                ctx.fillText('DIFFERENT LANDS  |  SAME DREAMS  |  ONE NATION', 400, 350);

                ctx.strokeStyle = '#cbd5e1';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(100, 380);
                ctx.lineTo(700, 380);
                ctx.stroke();

            } else if (type === 'middle') {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = 'rgba(234, 88, 12, 0.9)';
                ctx.beginPath();
                ctx.roundRect(60, 440, 320, 240, 16);
                ctx.fill();

                ctx.fillStyle = 'rgba(22, 163, 74, 0.9)';
                ctx.beginPath();
                ctx.roundRect(420, 440, 320, 240, 16);
                ctx.fill();

                ctx.fillStyle = '#FFFFFF';
                ctx.font = 'bold 24px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('Jammu & Kashmir', 220, 570);
                ctx.fillText('Tamil Nadu', 580, 570);

            } else {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = '#16A34A';
                ctx.beginPath();
                ctx.arc(400, 840, 140, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#FFFFFF';
                ctx.font = 'bold 24px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('INDIA MAP', 400, 850);
            }

            return canvas.toDataURL('image/png');
        }

        function updateProgress() {
            loadedCount++;
            const percent = Math.round((loadedCount / TOTAL_LAYERS) * 100);
            document.getElementById('loading-bar').style.width = percent + '%';
            document.getElementById('loading-text').innerText = `${loadedCount} / ${TOTAL_LAYERS} Images Processed`;

            if (loadedCount >= TOTAL_LAYERS) {
                const overlay = document.getElementById('loading-overlay');
                setTimeout(() => {
                    overlay.classList.add('opacity-0', 'pointer-events-none');
                    setTimeout(() => overlay.remove(), 500);
                }, 150);
            }
        }

        async function initPaperLayers() {
            // Load base sheet
            const baseData = await processImageChromaKey(IMAGE_FILES.base, { type: 'base', removeBlack: false });
            document.getElementById('img_base').src = baseData;
            updateProgress();

            // Load middle scenic collage
            const middleData = await processImageChromaKey(IMAGE_FILES.middle, { type: 'middle', removeBlack: true, threshold: 28 });
            document.getElementById('img_middle').src = middleData;
            updateProgress();

            // Load top India map
            const topData = await processImageChromaKey(IMAGE_FILES.top, { type: 'top', removeBlack: true, threshold: 28 });
            document.getElementById('img_top').src = topData;
            updateProgress();
        }

        function setupInteractionHandlers() {
            const world = document.getElementById('world_3d');
            let isDragging = false;
            let lastPointerX = 0;
            let lastPointerY = 0;

            // Touch gesture tracking
            let initialPinchDist = 0;
            let initialScale = 1;

            window.addEventListener('pointerdown', (e) => {
                if (e.target.closest('header')) return; // Ignore clicks on top navigation
                isDragging = true;
                lastPointerX = e.clientX;
                lastPointerY = e.clientY;
            });

            window.addEventListener('pointermove', (e) => {
                if (!isDragging) return;

                const deltaX = e.clientX - lastPointerX;
                const deltaY = e.clientY - lastPointerY;

                // Orbit rotation sensitivity
                state.targetRotY += deltaX * 0.45;
                state.targetRotX -= deltaY * 0.45;

                // Clamp tilt rotation range (0 = flat top view, 75 = steep tilt)
                state.targetRotX = Math.max(0, Math.min(75, state.targetRotX));
                
                // Wrap horizontal rotation
                if (state.targetRotY > 180) state.targetRotY -= 360;
                if (state.targetRotY < -180) state.targetRotY += 360;

                lastPointerX = e.clientX;
                lastPointerY = e.clientY;
            });

            window.addEventListener('pointerup', () => { isDragging = false; });
            window.addEventListener('pointercancel', () => { isDragging = false; });

            // Wheel Zoom
            window.addEventListener('wheel', (e) => {
                e.preventDefault();
                const zoomFactor = e.deltaY < 0 ? 1.08 : 0.92;
                state.targetScale = Math.max(0.5, Math.min(2.2, state.targetScale * zoomFactor));
            }, { passive: false });

            // Mobile Multi-Touch Pinch Zoom
            window.addEventListener('touchstart', (e) => {
                if (e.touches.length === 2) {
                    isDragging = false;
                    initialPinchDist = Math.hypot(
                        e.touches[0].clientX - e.touches[1].clientX,
                        e.touches[0].clientY - e.touches[1].clientY
                    );
                    initialScale = state.targetScale;
                }
            });

            window.addEventListener('touchmove', (e) => {
                if (e.touches.length === 2 && initialPinchDist > 0) {
                    const currentDist = Math.hypot(
                        e.touches[0].clientX - e.touches[1].clientX,
                        e.touches[0].clientY - e.touches[1].clientY
                    );
                    const scaleFactor = currentDist / initialPinchDist;
                    state.targetScale = Math.max(0.5, Math.min(2.2, initialScale * scaleFactor));
                }
            }, { passive: true });

            // Button UI Action Controls
            const btnTop = document.getElementById('btn-top');
            const btnIso = document.getElementById('btn-iso');
            const btnReset = document.getElementById('btn-reset');

            btnTop.addEventListener('click', () => {
                btnTop.classList.add('active');
                btnIso.classList.remove('active');
                state.targetRotX = 0; // Flat top down
                state.targetRotY = 0;
                state.targetPanX = 0;
                state.targetPanY = 0;
                state.targetScale = 1.0;
            });

            btnIso.addEventListener('click', () => {
                btnIso.classList.add('active');
                btnTop.classList.remove('active');
                state.targetRotX = 42;
                state.targetRotY = -18;
                state.targetScale = 0.95;
            });

            btnReset.addEventListener('click', () => {
                btnIso.classList.add('active');
                btnTop.classList.remove('active');
                state.targetRotX = 42;
                state.targetRotY = -18;
                state.targetPanX = 0;
                state.targetPanY = 0;
                state.targetScale = 0.95;
            });
        }

        /**
         * Ultra-smooth animation loop utilizing CSS 3D transform matrices.
         * Runs on GPU compositor thread at full native device refresh rate (60-120 FPS).
         */
        function animationLoop() {
            // Smooth lerp (linear interpolation) physics
            const lerpSpeed = 0.12;
            state.rotX += (state.targetRotX - state.rotX) * lerpSpeed;
            state.rotY += (state.targetRotY - state.rotY) * lerpSpeed;
            state.scale += (state.targetScale - state.scale) * lerpSpeed;
            state.panX += (state.targetPanX - state.panX) * lerpSpeed;
            state.panY += (state.targetPanY - state.panY) * lerpSpeed;

            // Compute dynamic 3D explosion gap based on tilt angle (rotX)
            // When rotX is close to 0 (top view), gap shrinks to 0 (flat page)
            const tiltRatio = Math.min(1, Math.max(0, state.rotX / 50));
            const targetGap = Math.pow(tiltRatio, 1.2) * state.maxZGap;
            state.currentZGap += (targetGap - state.currentZGap) * lerpSpeed;

            const gap = state.currentZGap;

            // Apply 3D matrix transform to main world stage
            const world = document.getElementById('world_3d');
            world.style.transform = `
                translate3d(${state.panX}px, ${state.panY}px, 0px)
                scale(${state.scale})
                rotateX(${state.rotX}deg)
                rotateY(${state.rotY}deg)
            `;

            // Apply Z-axis depth separation to individual layer cards
            const layerBase = document.getElementById('layer_base');
            const layerMiddle = document.getElementById('layer_middle');
            const layerTop = document.getElementById('layer_top');

            layerBase.style.transform = `translateZ(0px)`;
            layerMiddle.style.transform = `translateZ(${gap}px)`;
            layerTop.style.transform = `translateZ(${gap * 2.0}px)`;

            requestAnimationFrame(animationLoop);
        }

        // Initialize application on DOM load
        window.addEventListener('load', () => {
            initPaperLayers();
            setupInteractionHandlers();
            animationLoop();
        });
    </script>
</body>
</html>
