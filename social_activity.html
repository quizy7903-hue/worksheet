<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One India, Great India - 3D Layered World</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Three.js & OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            background-color: #090d16;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Glassmorphism Navigation Bar */
        .glass-nav {
            background: rgba(13, 19, 33, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
        }

        .btn-ui {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-ui:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.18);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-1px);
        }

        .btn-ui:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            border-color: rgba(255, 255, 255, 0.05);
        }

        .btn-ui.active {
            background: linear-gradient(135deg, rgba(249, 115, 22, 0.35), rgba(16, 185, 129, 0.35));
            border-color: rgba(249, 115, 22, 0.6);
            color: #ffffff;
            box-shadow: 0 0 15px rgba(249, 115, 22, 0.2);
        }

        #webgl-canvas {
            width: 100vw;
            height: 100vh;
            display: block;
            outline: none;
        }

        /* Custom subtle scrollbar/loader animation */
        .loading-pulse {
            animation: pulse 1.8s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 overflow-hidden select-none">

    <!-- Top Bar Navigation Controls -->
    <header class="fixed top-4 left-4 right-4 z-30 flex items-center justify-between gap-3 p-2.5 px-4 rounded-2xl glass-nav">
        
        <!-- Left: Project Branding -->
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-orange-500 via-white to-emerald-500 p-[2px] shadow-md">
                <div class="w-full h-full bg-slate-900 rounded-[10px] flex items-center justify-center">
                    <i class="fa-solid fa-layer-group text-orange-400 text-sm"></i>
                </div>
            </div>
            <div>
                <h1 class="font-bold text-sm md:text-base font-serif tracking-wide bg-gradient-to-r from-orange-400 via-slate-100 to-emerald-400 bg-clip-text text-transparent">
                    One India, Great India
                </h1>
                <p class="text-[10px] text-slate-400 font-medium">3D Interactive Document Viewer</p>
            </div>
        </div>

        <!-- Center: Minimalist Page Navigation Switcher -->
        <div class="flex items-center gap-1.5 bg-slate-900/90 p-1.5 rounded-xl border border-slate-800 shadow-inner">
            <button id="btn-prev" class="btn-ui w-8 h-8 rounded-lg flex items-center justify-center text-slate-400" disabled title="Previous Page">
                <i class="fa-solid fa-chevron-left text-xs"></i>
            </button>
            <span class="px-3.5 text-xs font-semibold text-orange-400 tracking-wider select-none">
                Page 1 of 1
            </span>
            <button id="btn-next" class="btn-ui w-8 h-8 rounded-lg flex items-center justify-center text-slate-400" disabled title="Next Page">
                <i class="fa-solid fa-chevron-right text-xs"></i>
            </button>
        </div>

        <!-- Right: Camera View Angle Presets -->
        <div class="flex items-center gap-1.5 bg-slate-900/70 p-1 rounded-xl border border-slate-800">
            <button id="btn-top" class="btn-ui px-3 py-1.5 rounded-lg text-xs font-medium text-slate-200 flex items-center gap-1.5">
                <i class="fa-solid fa-arrows-to-dot text-orange-400"></i>
                <span class="hidden sm:inline">Top View</span>
            </button>
            <button id="btn-iso" class="btn-ui px-3 py-1.5 rounded-lg text-xs font-medium text-slate-200 flex items-center gap-1.5 active">
                <i class="fa-solid fa-cube text-emerald-400"></i>
                <span class="hidden sm:inline">3D View</span>
            </button>
            <button id="btn-reset" class="btn-ui w-8 h-8 rounded-lg flex items-center justify-center text-slate-300" title="Reset Camera View">
                <i class="fa-solid fa-rotate-left text-xs"></i>
            </button>
        </div>
    </header>

    <!-- Bottom Status & Hint Bar -->
    <div class="fixed bottom-4 left-1/2 -translate-x-1/2 z-20 glass-nav px-5 py-2 rounded-full text-xs text-slate-300 flex items-center gap-3 shadow-2xl pointer-events-none">
        <span class="flex items-center gap-1.5">
            <i class="fa-solid fa-mouse text-orange-400 animate-bounce"></i> Drag to rotate camera
        </span>
        <span class="text-slate-600">•</span>
        <span class="text-emerald-400 flex items-center gap-1.5">
            <i class="fa-solid fa-layer-group"></i> Tilt camera to expand 3D depth
        </span>
    </div>

    <!-- WebGL Canvas -->
    <canvas id="webgl-canvas"></canvas>

    <script>
        
        // Local Directory PNG Files for Vercel Deployment
        const IMAGE_FILES = {
            base: 'social front page 2.png',
            middle: 'social front page 3.png',
            top: 'social front page india image.png'
        };

        // Three.js Globals
        let scene, camera, renderer, controls;
        let baseMesh, middleMesh, topMesh;
        let baseTexture, middleTexture, topTexture;

        // Dynamic 3D Layer Separation Controls
        const explosionState = {
            maxDistance: 0.85,    // Maximum vertical spacing when angled
            currentDistance: 0.4  // Smoothly interpolated distance
        };

        window.addEventListener('load', () => {
            initScene();
            loadAllTextures();
            setupUIEvents();
            animate();
        });

        function initScene() {
            const canvas = document.getElementById('webgl-canvas');

            // 1. Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x090d16);
            scene.fog = new THREE.FogExp2(0x090d16, 0.07);

            // 2. Camera
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 4.2, 3.8);

            // 3. WebGL Renderer
            renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;

            // 4. OrbitControls
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2 - 0.02; // Prevent camera going below floor
            controls.minDistance = 1.2;
            controls.maxDistance = 10;
            controls.target.set(0, 0, 0);

            // 5. Lighting Setup
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xfffdf5, 1.2);
            dirLight.position.set(3.5, 8, 3.5);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            dirLight.shadow.camera.near = 0.5;
            dirLight.shadow.camera.far = 16;
            dirLight.shadow.camera.left = -3;
            dirLight.shadow.camera.right = -3;
            dirLight.shadow.camera.top = 3;
            dirLight.shadow.camera.bottom = -3;
            dirLight.shadow.bias = -0.0002;
            scene.add(dirLight);

            // Secondary subtle fill light
            const fillLight = new THREE.DirectionalLight(0x38bdf8, 0.4);
            fillLight.position.set(-4, 3, -2);
            scene.add(fillLight);

            // 6. Floor & Grid Background
            const floorGeo = new THREE.PlaneGeometry(30, 30);
            const floorMat = new THREE.MeshStandardMaterial({ 
                color: 0x0d1527, 
                roughness: 0.85, 
                metalness: 0.15 
            });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.position.y = -0.05;
            floor.receiveShadow = true;
            scene.add(floor);

            const grid = new THREE.GridHelper(18, 36, 0xf97316, 0x1e293b);
            grid.position.y = -0.04;
            scene.add(grid);

            window.addEventListener('resize', onWindowResize);
        }

        /**
         * Loads image from relative URL and optionally key-out dark/black background pixels.
         */
        function loadProcessedTexture(url, removeBlack = false) {
            return new Promise((resolve) => {
                const img = new Image();
                img.crossOrigin = "anonymous";
                
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = img.width || 1200;
                    canvas.height = img.height || 1700;
                    const ctx = canvas.getContext('2d');

                    // Draw image onto canvas buffer
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                    // Automatic Chroma Keying: Convert pure/dark black background to alpha transparency
                    if (removeBlack) {
                        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                        const data = imgData.data;
                        for (let i = 0; i < data.length; i += 4) {
                            const r = data[i];
                            const g = data[i + 1];
                            const b = data[i + 2];
                            const maxColor = Math.max(r, g, b);

                            // Dark background threshold (pixels darker than RGB value 38)
                            if (maxColor < 38) {
                                // Smooth alpha feathering to eliminate harsh pixel artifacts
                                data[i + 3] = Math.max(0, Math.floor((maxColor / 38) * 255));
                            }
                        }
                        ctx.putImageData(imgData, 0, 0);
                    }

                    const tex = new THREE.CanvasTexture(canvas);
                    tex.anisotropy = renderer ? renderer.capabilities.getMaxAnisotropy() : 16;
                    tex.needsUpdate = true;
                    resolve(tex);
                };

                // Fallback generator if image is missing during development
                img.onerror = () => {
                    console.warn(`[3D World] Image "${url}" not found locally. Using fallback graphics.`);
                    const canvas = document.createElement('canvas');
                    canvas.width = 1200;
                    canvas.height = 1700;
                    const ctx = canvas.getContext('2d');

                    if (removeBlack) {
                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                        ctx.fillStyle = url.includes('india') ? 'rgba(18, 136, 7, 0.85)' : 'rgba(249, 115, 22, 0.85)';
                        ctx.beginPath();
                        ctx.arc(600, 850, 300, 0, Math.PI * 2);
                        ctx.fill();
                    } else {
                        ctx.fillStyle = '#FFFFFF';
                        ctx.fillRect(0, 0, canvas.width, canvas.height);
                        ctx.strokeStyle = '#FF9933';
                        ctx.lineWidth = 20;
                        ctx.strokeRect(40, 40, canvas.width - 80, canvas.height - 80);
                        ctx.fillStyle = '#1E293B';
                        ctx.font = 'bold 50px sans-serif';
                        ctx.textAlign = 'center';
                        ctx.fillText('ONE INDIA, GREAT INDIA', 600, 300);
                        ctx.font = '30px sans-serif';
                        ctx.fillText('(Please place PNG files in same folder)', 600, 400);
                    }

                    const tex = new THREE.CanvasTexture(canvas);
                    resolve(tex);
                };

                img.src = url;
            });
        }

        async function loadAllTextures() {
            // Standard Document Paper Dimensions (Aspect ~ 1 : 1.41)
            const paperW = 2.8;
            const paperH = 3.96;
            const paperGeo = new THREE.PlaneGeometry(paperW, paperH, 16, 16);

            // 1. Base Layer ("social front page 2.png")
            baseTexture = await loadProcessedTexture(IMAGE_FILES.base, false);
            const baseMat = new THREE.MeshStandardMaterial({ 
                map: baseTexture, 
                roughness: 0.45, 
                side: THREE.DoubleSide 
            });
            baseMesh = new THREE.Mesh(paperGeo, baseMat);
            baseMesh.rotation.x = -Math.PI / 2;
            baseMesh.castShadow = true;
            baseMesh.receiveShadow = true;
            scene.add(baseMesh);

            // 2. Middle Layer ("social front page 3.png" - Scenic Pictures)
            middleTexture = await loadProcessedTexture(IMAGE_FILES.middle, true);
            const middleMat = new THREE.MeshStandardMaterial({ 
                map: middleTexture, 
                transparent: true, 
                alphaTest: 0.05, 
                roughness: 0.35, 
                side: THREE.DoubleSide 
            });
            middleMesh = new THREE.Mesh(paperGeo, middleMat);
            middleMesh.rotation.x = -Math.PI / 2;
            middleMesh.castShadow = true;
            middleMesh.receiveShadow = true;
            scene.add(middleMesh);

            // 3. Top Map Layer ("social front page india image.png")
            topTexture = await loadProcessedTexture(IMAGE_FILES.top, true);
            const topMat = new THREE.MeshStandardMaterial({ 
                map: topTexture, 
                transparent: true, 
                alphaTest: 0.05, 
                roughness: 0.3, 
                side: THREE.DoubleSide 
            });
            topMesh = new THREE.Mesh(paperGeo, topMat);
            topMesh.rotation.x = -Math.PI / 2;
            topMesh.castShadow = true;
            topMesh.receiveShadow = true;
            scene.add(topMesh);
        }

        /**
         * Dynamically calculates vertical distance between layers.
         * Top view = zero gap (flat sheet).
         * Perspective view = exploded vertical spacing.
         */
        function updateLayerSeparation() {
            if (!baseMesh || !middleMesh || !topMesh) return;

            const camPos = camera.position;
            const distance = camPos.length();

            // Normalized vertical angle (cosTheta = 1 when directly above)
            const cosAngle = Math.min(Math.max(camPos.y / distance, 0), 1);
            
            // Tilt factor: 0 at perpendicular top view, increases toward 1 as camera tilts down
            const tiltFactor = Math.pow(1 - cosAngle, 1.25);

            // Target separation distance
            const targetDistance = tiltFactor * explosionState.maxDistance;

            // Interpolate distance smoothly
            explosionState.currentDistance += (targetDistance - explosionState.currentDistance) * 0.08;

            const d = explosionState.currentDistance;
            baseMesh.position.y = 0;
            middleMesh.position.y = d;
            topMesh.position.y = d * 2;
        }

        function setupUIEvents() {
            const btnTop = document.getElementById('btn-top');
            const btnIso = document.getElementById('btn-iso');
            const btnReset = document.getElementById('btn-reset');

            btnTop.addEventListener('click', () => {
                btnTop.classList.add('active');
                btnIso.classList.remove('active');
                animateCameraTo(0, 5.5, 0.01);
            });

            btnIso.addEventListener('click', () => {
                btnIso.classList.add('active');
                btnTop.classList.remove('active');
                animateCameraTo(0, 4.2, 3.8);
            });

            btnReset.addEventListener('click', () => {
                btnIso.classList.add('active');
                btnTop.classList.remove('active');
                animateCameraTo(0, 4.2, 3.8);
            });
        }

        function animateCameraTo(x, y, z) {
            const start = camera.position.clone();
            const target = new THREE.Vector3(x, y, z);
            let startTime = null;

            function step(time) {
                if (!startTime) startTime = time;
                const progress = Math.min((time - startTime) / 800, 1);
                const ease = 1 - Math.pow(1 - progress, 3); // Cubic ease-out

                camera.position.lerpVectors(start, target, ease);
                controls.update();

                if (progress < 1) requestAnimationFrame(step);
            }
            requestAnimationFrame(step);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            updateLayerSeparation();
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
